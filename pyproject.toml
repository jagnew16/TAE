[project]
name = "aaa-sales-assistant"
version = "0.1.0"
description = "AAA: an AI sales assistant prototype built on the OpenAI Agents SDK"
requires-python = ">=3.10"
dependencies = ["openai-agents==0.23.1"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["aaa*"]

[tool.setuptools.package-data]
aaa = ["seed/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
